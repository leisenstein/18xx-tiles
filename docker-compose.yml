# Runs the app with one command: docker compose up
services:
  app:
    # Build the image from the Dockerfile in this folder.
    build: .
    image: tiles18xx:latest

    # Make the app available at http://localhost:8080 on your PC.
    # Format: "PC port:container port"
    ports:
      - "8080:8080"

    # Settings passed to the app. Values like ${ADMIN_EMAIL} come from the .env file next to this file (not in git; see .env.example).
    environment:
      # Database location; replaces the path from appsettings.json.
      ConnectionStrings__Tiles: "Data Source=/data/tiles.db"
      # Keys that protect the sign-in cookie, kept on the volume so users stay signed in across restarts and rebuilds (DESIGN.md section 11a).
      DataProtection__KeysPath: "/data/keys"
      # First admin account, created at startup if missing (Phase 3). If these are empty, no admin account is created.
      Admin__Email: "${ADMIN_EMAIL:-}"
      Admin__Password: "${ADMIN_PASSWORD:-}"
      # The site's public address, used in password-reset email links.
      App__PublicUrl: "${PUBLIC_URL:-http://localhost:8080}"
      # Email through Resend (optional). Without a key, emails are written to the log (docker compose logs app).
      Email__ResendApiKey: "${RESEND_API_KEY:-}"
      Email__From: "${EMAIL_FROM:-}"

    # Store /data (the database and keys) on a Docker volume so it is kept
    # when the container is stopped, removed, or rebuilt.
    volumes:
      - tiles-data:/data

    # Restart automatically if the app crashes or the PC restarts.
    restart: unless-stopped

# Declare the volume used above.
volumes:
  tiles-data:
